const FRAMING=[{"s": "Burnout, lost bids, slow work and teams that misjudge each other tend to share one root.", "h": "The problems are connected", "body": "<p>Most of the problems an organisation struggles with are not separate problems. Staff burn out or leave. Work takes more effort than it should. Teams misjudge each other. The organisation sees itself one way and its clients see it another. Bids are lost, new services do not appear, and the same failures repeat without anyone being able to say why. Each of these usually gets its own programme and its own fix.</p><p>They tend to share one root. An organisation is made of living people, and it behaves like a living system. It stays healthy by changing how it works as the world around it changes. Over time, every organisation builds up ways of working that once made good sense and now get in the way. These can be rules, rewards, habits of communication between the people who do the work and the people who lead it, or gaps between what a person is responsible for and what they have the authority to change. Each was a sensible answer to an old problem, and nobody is at fault for it. Together they stop the organisation from adapting, and the problems above are how that shows.</p><p>When the problems are fixed one at a time, the root stays in place and the fixes do not last. It helps more to see the whole pattern at once: what people do each day, why it makes sense to them, and how one habit feeds another. This tool exists to make that pattern visible.</p>"}, {"s": "A group thrives when what is good for each member and what is good for the whole point the same way.", "h": "The science behind it", "body": "<p>Evolutionary biologists have studied for decades what lets a group of individuals work as one capable whole, in cells, in insect colonies and in human groups. Their answer is consistent. A group thrives when what is good for each member and what is good for the whole point the same way. Where a person or a unit can gain at the expense of the whole, the group weakens. This work is called multilevel selection theory.</p><p>The same research names the conditions that keep the two aligned. They include a fair share of effort and reward, a say in decisions, the ability to see what is going on, and fair ways to settle disagreements. This gives a grounded way to explain why an unhelpful habit persists, and what would have to change for a better one to take its place.</p><p>Profit-sharing and employee ownership rest on the same belief: that people who share in the success of the whole will act for the whole. The tool shows where daily life in the organisation already matches that belief, and where older rules and rewards still pull against it.</p>"}, {"s": "An organisation whose people act as one can adapt. A regenerative organisation also leaves its people, its clients and its places more capable.", "h": "From adapting to regenerating", "body": "<p>An organisation whose people act as one can adapt, and that is the first step. The second step is what the work leaves behind. A regenerative organisation does more than keep itself going. Its work leaves its people, its clients, and the communities and places it works in more capable and more alive than before. That in turn is what keeps the organisation itself viable over time. The tool looks at both steps.</p>"}, {"s": "The difficulties and the openings live in the daily experience of people. So this starts with their words.", "h": "Why it starts with what people say", "body": "<p>The difficulties and the openings in an organisation live in the daily experience of the people in it. The tool therefore starts with what people say and do, in their own words. The structure around those words is there to organise them so that decisions can be made. It is a map, and the map is not the territory. It gives no scores and it has no end state. It shows a direction, and whether things are moving in that direction.</p><p>The tool also keeps what only one person has noticed. Change in any living system starts with variation: someone, somewhere, doing something differently. A single observation is often where the new information is. It may be a practice that already works in one team, or the first sign of a shift among clients.</p>"}, {"s": "Many conversations become something a board can look at, beside figures it already reports.", "h": "What a leader gets from it", "body": "<p>The tool turns many conversations into something a board can look at. It connects them to figures the board already reports. It points to small changes that can be tried and then checked.</p>"}];

const Topo=(()=>{const canvas=document.getElementById("topo"),ctx=canvas.getContext("2d");const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf=null,start=null,bt=0,w=0,h=0,theme="stone",inst=[];
  function mk(seed){let s=seed>>>0;return()=>{s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};}
  function expand(ax,rules,n){let s=ax;for(let i=0;i<n;i++){let t="";for(const ch of s)t+=rules[ch]??ch;s=t;}return s;}
  const SYS=[{str:expand("X",{X:"F+[[X]-X]-F[-FX]+X",F:"FF"},5),angle:25},{str:expand("F",{F:"FF+[+F-F-F]-[-F+F+F]"},4),angle:22.5}];
  SYS.forEach(s=>{s.f=(s.str.match(/F/g)||[]).length;});
  const PAL={stone:[["160,138,108",.28],["184,149,106",.26],["122,139,111",.24],["175,148,90",.25],["145,132,105",.23]],dark:[["200,172,130",.3],["215,175,108",.28],["158,178,140",.26],["210,168,95",.27],["185,162,128",.25]]};
  const BG={stone:"237,229,216",dark:"30,28,25"};
  function seedInst(t){const rng=mk(t==="stone"?2371:9031);inst=[];const place=(count,cols,rows)=>{const cells=[...Array(cols*rows).keys()];for(let i=cells.length-1;i>0;i--){const j=rng()*(i+1)|0;[cells[i],cells[j]]=[cells[j],cells[i]];}return cells.slice(0,count).map(ci=>({x:(ci%cols)/cols+(1/cols)*(.2+rng()*.6),y:Math.floor(ci/cols)/rows+(1/rows)*(.2+rng()*.6)}));};
    for(const p of place(2+(rng()*2|0),4,3))inst.push({sys:rng()<.5?0:1,x:p.x,y:p.y,sc:.75+rng()*.45,pal:rng()*5|0,ph:rng()*6.28,axes:rng()<.5?5:6,rot:rng()*360,bg:false});
    for(const p of place(13+(rng()*5|0),6,5))inst.push({sys:rng()<.5?0:1,x:p.x,y:p.y,sc:.25+rng()*.25,pal:rng()*5|0,ph:rng()*6.28,axes:rng()<.5?5:6,rot:rng()*360,bg:true,a:.03+rng()*.09});}
  function turtle(str,x,y,hd,step,ang,maxF){const toR=Math.PI/180;let a=hd*toR;const dA=ang*toR,st=[];let f=0;ctx.beginPath();ctx.moveTo(x,y);for(const c of str){if(c==="F"){if(f>=maxF)break;f++;x+=step*Math.cos(a);y+=step*Math.sin(a);ctx.lineTo(x,y);}else if(c==="+")a+=dA;else if(c==="-")a-=dA;else if(c==="[")st.push(x,y,a);else if(c==="]"){a=st.pop();y=st.pop();x=st.pop();ctx.moveTo(x,y);}}ctx.stroke();}
  function grow(e){return e<2.5?(e/2.5)*.85:e<22.5?.85+((e-2.5)/20)*.15:1;}
  function draw(e){ctx.fillStyle="rgb("+BG[theme]+")";ctx.fillRect(0,0,w,h);ctx.lineWidth=1;ctx.lineCap="round";ctx.lineJoin="round";const fr=grow(e),cell=Math.min(w/4,h/3);
    for(const it of inst){const sys=SYS[it.sys],col=PAL[theme][it.pal],ox=it.x*w,oy=it.y*h,step=(cell*1.4/25)*it.sc,maxF=Math.floor(fr*sys.f),br=Math.sin(bt*.6+it.ph)*2.5;
      const alpha=it.bg?it.a:Math.min(.015*Math.pow(it.sc/.5,3.2),.35);ctx.strokeStyle="rgba("+col[0]+","+alpha.toFixed(3)+")";
      for(let ai=0;ai<it.axes;ai++)turtle(sys.str,ox,oy,(360/it.axes)*ai+it.rot,step,sys.angle+br,maxF);}}
  function loop(ts){if(start===null)start=ts;draw((ts-start)/1000);bt+=.012;raf=requestAnimationFrame(loop);}
  function resize(){const p=canvas.parentElement;w=canvas.width=p.offsetWidth;h=canvas.height=p.offsetHeight;}
  function show(t){theme=t;seedInst(t);resize();cancelAnimationFrame(raf);start=null;canvas.classList.add("show");if(reduced)draw(999);else raf=requestAnimationFrame(loop);}
  function hide(){canvas.classList.remove("show");cancelAnimationFrame(raf);raf=null;}

 {t:"Title",full:1,topo:"stone",html:()=>'<div class="hero"><span class="label">October 2026</span><h1>Making sense of<br>how we <em>adapt</em>.</h1><p class="lede">This page holds observations: things that people across the organisation said or did in '+months()+'. It sets each one beside eight conditions, drawn from Nobel Prize-winning research, that help a group to navigate change organically, as it emerges, and to grow through it. Seen together, the observations show where those conditions are present in daily work, and where they are not.</p><p class="note"><b>Every observation and placement on this page is invented</b> to show how the tool works. None describes a real organisation.</p></div>'},
 {t:"Why this matters",full:1,html:()=>'<span class="label">Why this matters</span><div class="essay2">'+FRAMING.map(f=>'<h3>'+esc(f.h)+'</h3>'+f.body).join("")+'</div><p class="small">Sources for the science: Wilson and Sober, 1989, and Wilson, Ostrom and Cox, 2013. The research has critics, and it has been tested more in communities than in companies.</p>'},
 {t:"Applying this to an organisation",full:1,html:()=>'<span class="label">Applying this research to an organisation</span><h2>What the organisation <em>already reports</em>.</h2><p class="muted">The research describes conditions under which a group adapts. Most organisations already report figures like these. This screen holds them, each with its source, beside the aim the leadership has set. The observations on the next screens sit beside both.</p><div class="figs"><div class="fig"><span class="label">Staff turnover</span><span class="n">—</span><span class="small">from the organisation’s own reporting</span></div><div class="fig"><span class="label">Operating margin</span><span class="n">—</span><span class="small">from the organisation’s own reporting</span></div><div class="fig"><span class="label">Sickness absence</span><span class="n">—</span><span class="small">from the organisation’s own reporting</span></div><div class="fig"><span class="label">Employees</span><span class="n">—</span><span class="small">from the organisation’s own reporting</span></div></div><div class="aim"><div><span class="label">The aim the leadership has set</span><blockquote>The aim, in the leadership’s own words.</blockquote></div><p>Most organisations also run staff surveys and wellbeing or risk assessments. A survey gives scores. The observations that follow give reasons, in the words of the people concerned.</p></div>'},
 {t:"What was heard and seen",html:()=>'<span class="label">What was observed</span><h2>What was heard <em>and seen</em>.</h2><p class="muted">Each dot is one observation: something a person said, something that was seen, or a figure from the records. They come from conversations in '+months()+'. Nothing is grouped or judged here.</p>'+RO+'<button type="button" class="btn" data-list="1">Read all '+O.length+" as a list</button>"+'<span class="label">Who gave them</span>'+bandsTable()+'<p class="todo">To be added: how people were chosen, who has not been heard, and that each person agreed to this use of their words.</p>'},
 {t:"Eight conditions",html:()=>'<span class="label">The science</span><h2>Eight <em>conditions</em>.</h2><p class="muted">Elinor Ostrom studied long-lasting groups that manage a shared resource. She found eight conditions that those groups share. In 2009 she received the Nobel Memorial Prize in Economic Sciences.</p><p class="muted">Later work argues that the same conditions apply to groups of many kinds (Wilson, Ostrom and Cox, 2013). To apply them to how a company navigates change is a reasonable inference. It has not been tested directly.</p><div class="clist">'+SHORT.slice(1).map((n,i)=>'<button type="button" data-c="'+(i+1)+'"><b>'+(i+1)+"</b><span>"+esc(COND[i+1].n)+"</span></button>").join("")+"</div>"},
 {t:"Through the eight conditions",html:()=>'<span class="label">The same observations, through the science</span><h2>Each observation, beside <em>one</em> condition.</h2><p class="muted">Each dot moves to the one condition it concerns. Green means the observation supports that condition: it was judged present. Rust means the observation works against it: it was judged absent. The judgement is one person’s reading, and each condition has a rule for it.</p>'+KEY+'<p class="small">'+NF.length+' observations fit none of the eight. They sit below the wheel. “Too few to say” means fewer than 5 observations or fewer than 4 sources.</p>'+RO+'<p class="todo">Select a condition to read its rule and its observations. Check by a second reader: not yet done.</p>'},

 {t:"What may not be working",html:()=>'<span class="label">The same science, the other side</span><h2>What may <em>not</em> be working.</h2><p class="muted">Now the supporting observations fade. What remains in rust is where a condition was judged absent. The research expects that to make it harder for a group to adapt. Where a condition has too few observations to say, the wheel says so.</p><span class="label">Three examples</span>'+[4,21,8].map(id=>O.find(o=>o.id===id)).map(o=>'<button type="button" class="card" data-o="'+o.id+'"><span class="q">“'+esc(o.t)+'”</span><small>'+esc(band(o))+"</small></button>").join("")+'<p class="small">Nobody is at fault for these. Each behaviour once solved a problem for someone.</p>'},
 {t:"What this suggests",html:()=>{let rows="";for(let i=1;i<=8;i++){const ev=condEvidence(i),w=ev.filter(e=>e.s==="work").length;rows+='<button type="button" data-c="'+i+'"><b>'+i+'</b><span>'+esc(SHORT[i])+'<br><span class="small">'+(ev.length?(ev.length+" observations: "+w+" present, "+(ev.length-w)+" absent"+(few(ev)?". Too few to say.":"")):"No observation yet. Nobody has looked.")+"</span></span></button>";}

 {t:"Beside the goals the organisation has set",html:()=>'<span class="label">Back to the organisation’s own goals</span><h2>Beside the goals the organisation <em>has set</em>.</h2><p class="muted">Each box holds one goal of the kind most organisations set. With a real organisation, each box holds a line from its own strategy or annual report. The dots that move into a box are the observations whose condition bears on that line. The observations do not explain the figures. They show what people describe in the places where the goals are meant to be met.</p><div class="clist"><button type="button" data-f="0"><b>1</b><span>Shared success and collaboration<br><span class="small">Fair reward (2) and a shared purpose (1)</span></span></button><button type="button" data-f="1"><b>2</b><span>Efficiency and productivity<br><span class="small">Seeing clearly (4)</span></span></button><button type="button" data-f="2"><b>3</b><span>Growing the business<br><span class="small">Working across units (8)</span></span></button><button type="button" data-f="3"><b>4</b><span>Attracting and keeping people<br><span class="small">Room to decide (7) and a shared purpose (1)</span></span></button></div>'+RO},
 {t:"How an organisation keeps adapting",dark:1,topo:"dark",html:()=>'<span class="label">Over time</span><h2>How an organisation keeps <em>adapting</em>.</h2><p class="muted">Evolutionary theory describes how a living system changes. People try different ways of working. The ways that are rewarded continue. What continues spreads until it is normal (Wilson, Hayes, Biglan and Embry, 2014).</p><p class="muted">The eight conditions are what let a group do these three things. Room to decide and a say in decisions let people try. Fair reward and seeing clearly decide what continues. Working across units and a shared purpose let it spread. That link is a reasonable inference from the research, and the dots show where the observations sit in the three steps.</p>'+KEY+RO+'<p>Seen this way, adapting is continuous. It has no end state and no score. It has a direction, and the observations show where that direction is already present.</p>'}

  if(sc.topo)Topo.show(sc.topo);else Topo.hide();
  document.getElementById("lbl").textContent=cur+" of "+N+" · "+sc.t;document.getElementById("toplbl").textContent=cur===1?"":sc.t;
  document.getElementById("prev").disabled=cur===1;document.getElementById("next").disabled=cur===N;
  document.getElementById("pips").innerHTML=SC.slice(1).map((s,i)=>'<button type="button" data-go="'+(i+1)+'" class="'+(i+1===cur?"on":"")+'" aria-label="'+esc(s.t)+'" title="'+esc(s.t)+'"></button>').join("");
  try{history.replaceState(null,"","#s"+cur);}catch(e){}}
const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");let last=null;
function open(html){last=document.activeElement;drawer.innerHTML='<button type="button" class="x" data-close="1" aria-label="Close">✕</button>'+html;drawer.hidden=false;scrim.hidden=false;drawer.scrollTop=0;drawer.querySelector(".x").focus();}
function close(){drawer.hidden=true;scrim.hidden=true;if(last&&last.focus)last.focus();}
const qb=(o,s)=>'<button type="button" class="bq '+(s==="work"?"work":"")+'" data-o="'+o.id+'"><span class="q">'+quote(o)+"</span><small>"+esc(band(o))+" · "+esc(o.k)+"</small></button>";
function openObs(id){const o=O.find(x=>x.id===id),cd=codeOf(o),interp=cur>=6;
  open('<span class="label">Observation</span><h2 class="q">'+quote(o)+"</h2><dl><dt>Kind</dt><dd>"+esc(o.k)+"</dd><dt>Source</dt><dd>"+esc(band(o))+"</dd><dt>Date</dt><dd>"+esc(month(o))+"</dd><dt>Where it was seen</dt><dd>"+LEVELS[o.level]+"</dd>"+(interp?"<dt>Condition it concerns</dt><dd>"+(cd?'<button type="button" class="lb" data-c="'+cd[0]+'">'+cd[0]+". "+esc(COND[cd[0]].n)+"</button><br>Judged "+(cd[1]==="work"?"present":"absent")+"."+(cd[2]?" Reason: "+esc(cd[2]):""):"It fits none of the eight conditions.")+"</dd>":"")+"</dl>");}
function openCond(i){const c=COND[i],r=RULES[i],ev=condEvidence(i),w=ev.filter(e=>e.s==="work"),m=ev.filter(e=>e.s==="miss"),show=cur>=6;
  const bands={};ev.forEach(e=>{const b=band(e.o);bands[b]=bands[b]||[0,0];bands[b][e.s==="work"?0:1]++;});
  open('<span class="label">Condition '+i+" of 8</span><h2>"+esc(c.n)+"</h2><dl><dt>What the research found</dt><dd>"+esc(c.w)+"</dd><dt>Why it matters for change</dt><dd>"+esc(c.a)+"</dd><dt>Rule for the judgement</dt><dd>"+esc(r[0])+"<br>Fits: "+esc(r[1])+"<br>Does not fit: "+esc(r[2])+"</dd><dt>Name in the research</dt><dd>"+esc(c.r)+"</dd></dl>"+
   (show?(ev.length?'<span class="sub">'+ev.length+(ev.length===1?" observation":" observations")+" from "+new Set(ev.map(e=>e.o.s)).size+" sources"+(few(ev)?" · too few to say":"")+'</span><div class="two"><div><span class="sub">Judged present</span>'+(w.map(e=>qb(e.o,"work")).join("")||'<p class="small">None.</p>')+'</div><div><span class="sub">Judged absent</span>'+(m.map(e=>qb(e.o,"miss")).join("")||'<p class="small">None.</p>')+'</div></div><span class="sub">Who described this</span><table><tr><th>Source</th><th>Present</th><th>Absent</th></tr>'+Object.keys(bands).map(b=>"<tr><td>"+b+"</td><td>"+bands[b][0]+"</td><td>"+bands[b][1]+"</td></tr>").join("")+'</table><p class="small">The numbers are small. They show who has spoken so far.</p>':'<p class="small">No observation concerns this condition yet. This means nobody has looked. It does not mean the condition is present.</p>'):""));}
function openList(title,list,neutral){open('<span class="label">'+list.length+" observations</span><h2>"+esc(title)+"</h2>"+list.map(o=>qb(o,neutral?"":clsOf(o))).join(""));}
function openAbout(){open('<span class="label">About this page</span><h2>About this page</h2><div class="essay"><p>This page sets observations from conversations inside an organisation beside eight conditions that research has found in groups that adapt well. It is a prototype. Every observation and placement on it is invented to show how the page works.</p><p>This page was made by <a href="https://www.ben-preston.com" target="_blank" rel="noopener">Ben Preston</a>.</p></div><dl><dt>Eight conditions</dt><dd>Wilson, Ostrom and Cox, 2013. Generalizing the core design principles for the efficacy of groups. <i>Journal of Economic Behavior &amp; Organization</i>, 90, S21–S32. Elinor Ostrom received the 2009 Nobel Memorial Prize in Economic Sciences for her analysis of economic governance, especially the commons.</dd><dt>Groups as living systems</dt><dd>Wilson and Sober, 1989. Reviving the superorganism. <i>Journal of Theoretical Biology</i>, 136, 337–356.</dd><dt>Three steps of adapting</dt><dd>Wilson, Hayes, Biglan and Embry, 2014. Evolving the future: toward a science of intentional change. <i>Behavioral and Brain Sciences</i>, 37, 395–416.</dd><dt>Made</dt><dd>October 2026. Set in Fraunces and DM Sans.</dd></dl>');}
function openFraming(i){const f=FRAMING[i];open('<span class="label">Why this matters · '+(i+1)+" of "+FRAMING.length+"</span><h2>"+esc(f.h)+'</h2><div class="essay">'+f.body+"</div>");}
document.addEventListener("click",e=>{
  if(e.target===scrim){close();return;}
  const b=e.target.closest("[data-close],[data-go],[data-fr],[data-list],[data-f],[data-o],[data-c]");if(!b)return;
  if(b.dataset.close)close();
  else if(b.dataset.go)go(+b.dataset.go);
  else if(b.dataset.fr)openFraming(+b.dataset.fr);
  else if(b.dataset.list)openList("What was heard and seen",O.slice().sort((x,y)=>Date.parse(x.d)-Date.parse(y.d)),true);
  else if(b.dataset.f){const i=+b.dataset.f;openList(FIGS[i][0].replace("“","")+" "+FIGS[i][1].replace(/”.*/,""),O.filter(o=>figOf(o)===i));}
  else if(b.dataset.o)openObs(+b.dataset.o);
  else if(b.dataset.c)openCond(+b.dataset.c);});
function ro(o){const el=document.getElementById("ro");if(!el)return;el.innerHTML='<span class="label">'+esc(band(o))+" · "+esc(o.k)+'</span><div class="t">'+quote(o)+"</div>";}
document.addEventListener("mouseover",e=>{const d=e.target.closest&&e.target.closest(".d");if(d)ro(O.find(o=>o.id===+d.dataset.o));});
document.addEventListener("focusin",e=>{const d=e.target.closest&&e.target.closest(".d");if(d)ro(O.find(o=>o.id===+d.dataset.o));});
document.addEventListener("keydown",e=>{
  if(!drawer.hidden){if(e.key==="Escape")close();return;}
  const t=e.target;if((e.key==="Enter"||e.key===" ")&&t instanceof SVGElement){e.preventDefault();if(t.dataset.o)openObs(+t.dataset.o);else if(t.dataset.c)openCond(+t.dataset.c);else if(t.dataset.f)t.dispatchEvent(new MouseEvent("click",{bubbles:true}));return;}
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(cur+1);}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1);}});
document.getElementById("prev").addEventListener("click",()=>go(cur-1));
document.getElementById("next").addEventListener("click",()=>go(cur+1));
document.getElementById("about").addEventListener("click",openAbout);
buildSVG();
const hh=/^#s(\d+)$/.exec(location.hash);go(hh?+hh[1]:1);
</script>
